<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>なんでそれ知ってるの？</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">KNOWLEDGE GACHA</p>
      <h1>なんでそれ知ってるの？</h1>
      <p class="subtitle">知らない世界への入口になる言葉を、ランダムに。</p>
    </section>

    <section class="card" aria-live="polite">
      <div class="category" id="category">映画会社</div>
      <div class="word" id="word">A24</div>

      <div class="meaning-panel" id="meaningPanel" hidden>
        <p class="meaning-label">30秒で理解</p>
        <p class="meaning-text" id="meaningText"></p>
      </div>

      <div class="meta">100語からランダム出題 ・ Version 0.2</div>
    </section>

    <div class="actions">
      <button id="meaningButton" class="meaning-button" type="button">
        意味を見る
      </button>
      <button id="nextButton" class="next-button" type="button">
        次の言葉 →
      </button>
    </div>

    <p class="hint">意味を確認したら、次の言葉へ。知らない界隈を少しずつ覗いていこう。</p>
  </main>

  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
