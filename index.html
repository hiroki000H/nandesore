<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>なんでそれ知ってるの？</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="homeScreen" class="screen">
      <div class="hero home-hero">
        <p class="eyebrow">KNOWLEDGE GACHA</p>
        <h1>なんでそれ<br />知ってるの？</h1>
        <p class="subtitle">知らない世界への入口になる言葉を、ランダムに。</p>
      </div>

      <div class="home-card">
        <p class="home-card-label">収録語数</p>
        <p class="home-count"><span id="wordCount">0</span>語</p>
        <p class="home-card-copy">映画、心理、料理、建築、スポーツ。界隈を飛び越えて知識を拾おう。</p>
      </div>

      <div class="home-actions">
        <button id="startButton" class="primary-button" type="button">ランダムで始める →</button>
        <button id="historyButton" class="secondary-button" type="button">履歴を見る</button>
      </div>
    </section>

    <section id="studyScreen" class="screen" hidden>
      <div class="topbar">
        <button id="homeButton" class="icon-button" type="button">← ホーム</button>
        <span id="progressText" class="topbar-meta"></span>
      </div>

      <section class="card" aria-live="polite">
        <div class="category" id="category"></div>
        <div class="word" id="word"></div>

        <div class="meaning-panel" id="meaningPanel" hidden>
          <p class="meaning-label">30秒で理解</p>
          <p class="meaning-text" id="meaningText"></p>
        </div>
      </section>

      <div class="actions main-actions">
        <button id="meaningButton" class="meaning-button" type="button">意味を見る</button>
        <button id="nextButton" class="next-button" type="button">次の言葉 →</button>
      </div>

      <button id="backButton" class="back-button" type="button" disabled>← ひとつ前に戻る</button>
      <p class="hint">見た言葉は自動で履歴に保存されます。</p>
    </section>

    <section id="historyScreen" class="screen" hidden>
      <div class="topbar">
        <button id="historyHomeButton" class="icon-button" type="button">← ホーム</button>
        <button id="clearHistoryButton" class="text-button" type="button">履歴を消去</button>
      </div>

      <div class="history-heading">
        <p class="eyebrow">HISTORY</p>
        <h2>これまでに見た言葉</h2>
        <p id="historySummary" class="subtitle"></p>
      </div>

      <div id="historyList" class="history-list"></div>
      <div id="emptyHistory" class="empty-state" hidden>
        まだ履歴がありません。<br />ランダムガチャを回してみよう。
      </div>
    </section>
  </main>

  <script src="words.js"></script>
  <script src="words-extra.js"></script>
  <script src="script.js"></script>
</body>
</html>
